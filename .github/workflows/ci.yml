name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Kedro Dependencies
        run: |
          cd kedro-pipeline
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      
      - name: Run Pytest (Kedro Pipeline)
        run: |
          cd kedro-pipeline
          pytest tests/
      
      - name: Install ML Backend Dependencies
        run: |
          cd backend-ml
          pip install -r requirements.txt
          pip install pytest
      
      - name: Run Pytest (ML Backend)
        run: |
          cd backend-ml
          pytest tests/

  spring-boot-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Build Spring Boot Application
        run: |
          cd backend-spring
          ./mvnw clean package -DskipTests || mvn clean package -DskipTests

  nextjs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-next/package-lock.json
      
      - name: Install Dependencies
        run: |
          cd frontend-next
          npm ci
      
      - name: Build Next.js Application
        run: |
          cd frontend-next
          npm run build
