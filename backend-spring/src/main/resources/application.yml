server:
  port: 8081
spring:
  application:
    name: health-analytics
  datasource:
    url: jdbc:postgresql://localhost:5432/nhanes_analytics
    username: postgres
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect



management:
  endpoints:
    web:
      exposure:
        include: health,info
