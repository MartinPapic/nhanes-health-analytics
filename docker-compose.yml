version: "3.9"

# =============================================================================
# Docker Compose — NHANES PostgreSQL Local
# Uso:
#   docker compose up -d          # levantar
#   docker compose down           # bajar
#   docker compose down -v        # bajar y borrar datos
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: nhanes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       nhanes
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: nhanes2024
    ports:
      - "5432:5432"
    volumes:
      - nhanes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nhanes"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nhanes_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@nhanes.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  nhanes_pgdata:
